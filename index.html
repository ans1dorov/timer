<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GTA VI Countdown</title>

  <!-- Open Graph мета-теги для предпросмотра -->
  <meta property="og:title" content="GTA VI — Обратный отсчет">
  <meta property="og:description" content="Следите за временем до релиза в разных регионах в реальном времени.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ans1dorov.github.io/timer/">
  <meta property="og:image" content="https://ans1dorov.github.io/timer/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #120324;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .badge {
      background: #ffffff;
      color: #120324;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Переключатель регионов */
    .region-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 440px;
      margin-bottom: 20px;
    }
    .region-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #c0a7d9;
      border: 1px solid rgba(226, 73, 157, 0.3);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .region-btn.active {
      background: #e2499d;
      color: #ffffff;
      border-color: #e2499d;
      box-shadow: 0 0 14px rgba(226, 73, 157, 0.6);
    }

    .timer-card {
      border: 2px solid #e2499d;
      border-radius: 12px;
      padding: 24px 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 25px rgba(226, 73, 157, 0.35);
      background: rgba(255, 255, 255, 0.03);
    }
    .timer-values {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .timer-labels {
      display: flex;
      justify-content: space-around;
      font-size: 11px;
      letter-spacing: 1px;
      color: #c0a7d9;
      text-transform: uppercase;
      font-weight: 600;
      padding: 0 4px;
    }
    .timer-labels span {
      width: 25%;
    }
    .release-info {
      font-size: 14px;
      font-weight: 600;
      color: #ff8ad8;
      margin-top: 14px;
      letter-spacing: 0.3px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 28px 0 12px;
    }
    .description {
      font-size: 14px;
      line-height: 1.5;
      color: #d1c2e8;
      max-width: 360px;
    }
  </style>
</head>
<body>

  <div class="badge">Grand Theft Auto VI — Countdown</div>

  <!-- Кнопки выбора региона -->
  <div class="region-selector" id="regionSelector">
    <button class="region-btn active" onclick="setRegion('nz')">🇳🇿 Новая Зеландия</button>
    <button class="region-btn" onclick="setRegion('in')">🇮🇳 Индия</button>
    <button class="region-btn" onclick="setRegion('tr')">🇹🇷 Турция</button>
    <button class="region-btn" onclick="setRegion('pl')">🇵🇱 Польша</button>
    <button class="region-btn" onclick="setRegion('us')">🇺🇸 США</button>
  </div>

  <div class="timer-card">
    <div class="timer-values" id="countdown">00:00:00:00</div>
    <div class="timer-labels">
      <span>Дней</span>
      <span>Часов</span>
      <span>Минут</span>
      <span>Секунд</span>
    </div>
    <div class="release-info" id="releaseInfo">18 ноября в 14:00 (МСК)</div>
  </div>

  <h1 class="title">Приготовьтесь к релизу</h1>
  <p class="description">
    Выберите свой регион выше, чтобы следить за точным временем запуска игры.
  </p>

  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {
      console.error("Telegram WebApp init error:", e);
    }

    // Время релиза строго зафиксировано по часовому поясу Москвы (UTC+3)
    const REGIONS = {
      nz: {
        target: new Date("2026-11-18T14:00:00+03:00").getTime(),
        info: "Релиз: 18 ноября в 14:00 (МСК)"
      },
      in: {
        target: new Date("2026-11-18T21:30:00+03:00").getTime(),
        info: "Релиз: 18 ноября в 21:30 (МСК)"
      },
      tr: {
        target: new Date("2026-11-19T00:00:00+03:00").getTime(),
        info: "Релиз: 19 ноября в 00:00 (МСК)"
      },
      pl: {
        target: new Date("2026-11-19T02:00:00+03:00").getTime(),
        info: "Релиз: 19 ноября в 02:00 (МСК)"
      },
      us: {
        target: new Date("2026-11-19T08:00:00+03:00").getTime(),
        info: "Релиз: 19 ноября в 08:00 (МСК)"
      }
    };

    let currentRegion = 'nz';

    function setRegion(code) {
      currentRegion = code;
