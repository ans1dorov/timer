<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GTA VI Countdown</title>

  <!-- Open Graph мета-теги для предпросмотра в Telegram -->
  <meta property="og:title" content="GTA VI — Обратный отсчет">
  <meta property="og:description" content="Следите за временем до релиза в реальном времени.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ans1dorov.github.io/timer/">
  <!-- Прямая ссылка на картинку для карточки (размер 1200x630 или скриншот таймера) -->
  <meta property="og:image" content="https://ans1dorov.github.io/timer/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Далее ваши стили <style> ... -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Countdown Timer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #120324;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .badge {
      background: #ffffff;
      color: #120324;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 6px;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .timer-card {
      border: 2px solid #e2499d;
      border-radius: 12px;
      padding: 24px 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 25px rgba(226, 73, 157, 0.35);
      background: rgba(255, 255, 255, 0.03);
    }
    .timer-values {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .timer-labels {
      display: flex;
      justify-content: space-around;
      font-size: 11px;
      letter-spacing: 1px;
      color: #c0a7d9;
      text-transform: uppercase;
      font-weight: 600;
      padding: 0 4px;
    }
    .timer-labels span {
      width: 25%;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      margin: 32px 0 16px;
    }
    .description {
      font-size: 14px;
      line-height: 1.5;
      color: #d1c2e8;
      max-width: 360px;
    }
  </style>
</head>
<body>

  <div class="badge">Get ready for Grand Theft Auto VI</div>

  <div class="timer-card">
    <div class="timer-values" id="countdown">00:00:00:00</div>
    <div class="timer-labels">
      <span>Days</span>
      <span>Hours</span>
      <span>Minutes</span>
      <span>Seconds</span>
    </div>
  </div>

  <h1 class="title">Get ready for Grand Theft Auto VI</h1>
  <p class="description">
    Launch day is just around the corner. Don't forget to preload your game so you can play immediately.
  </p>

  <script>
  // Безопасная инициализация Telegram SDK
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  } catch (e) {
    console.error("Telegram WebApp init error:", e);
  }

  // Задаем дату через явные аргументы (Год, Месяц [0-11], День, Часы, Минуты, Секунды)
  // Обратите внимание: декабрь — это 11-й месяц было 2026, 10, 19, 8, 00, 00
  const targetDate = new Date(2026, 10, 18, 21, 30, 00).getTime();

  function updateTimer() {
    const countdownEl = document.getElementById("countdown");
    if (!countdownEl) return;

    const now = Date.now();
    const difference = targetDate - now;

    if (difference <= 0) {
      countdownEl.innerText = "00:00:00:00";
      return;
    }

    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    const pad = (n) => String(n).padStart(2, "0");
    countdownEl.innerText = `${pad(days)}:${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  // Запускаем сразу и вешаем интервал
  updateTimer();
  setInterval(updateTimer, 1000);
</script>
</body>
</html>
