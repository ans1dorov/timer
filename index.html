<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GTA VI Countdown</title>

  <meta property="og:title" content="GTA VI — Обратный отсчет">
  <meta property="og:description" content="Следите за временем до релиза в разных регионах в реальном времени.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ans1dorov.github.io/timer/">
  <meta property="og:image" content="https://ans1dorov.github.io/timer/preview.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #120324;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .badge {
      background: #ffffff;
      color: #120324;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .region-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 440px;
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }
    .region-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #c0a7d9;
      border: 1px solid rgba(226, 73, 157, 0.3);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .region-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .region-btn.active {
      background: #e2499d;
      color: #ffffff;
      border-color: #e2499d;
      box-shadow: 0 0 14px rgba(226, 73, 157, 0.6);
    }
    .timer-card {
      border: 2px solid #e2499d;
      border-radius: 12px;
      padding: 24px 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 25px rgba(226, 73, 157, 0.35);
      background: rgba(255, 255, 255, 0.03);
    }
    .timer-values {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .timer-labels {
      display: flex;
      justify-content: space-around;
      font-size: 11px;
      letter-spacing: 1px;
      color: #c0a7d9;
      text-transform: uppercase;
      font-weight: 600;
      padding: 0 4px;
    }
    .timer-labels span {
      width: 25%;
    }
    .release-info {
      font-size: 14px;
      font-weight: 600;
      color: #ff8ad8;
      margin-top: 14px;
      letter-spacing: 0.3px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 28px 0 12px;
    }
    .description {
      font-size: 14px;
      line-height: 1.5;
      color: #d1c2e8;
      max-width: 360px;
    }
  </style>
</head>
<body>

  <div class="badge">Grand Theft Auto VI — Countdown</div>

  <div class="region-selector" id="regionSelector">
    <button type="button" class="region-btn active" data-region="nz">🇳🇿 Новая Зеландия</button>
    <button type="button" class="region-btn" data-region="in">🇮🇳 Индия</button>
    <button type="button" class="region-btn" data-region="tr">🇹🇷 Турция</button>
    <button type="button" class="region-btn" data-region="pl">🇵🇱 Польша</button>
    <button type="button" class="region-btn" data-region="us">🇺🇸 США</button>
  </div>

  <div class="timer-card">
    <div class="timer-values" id="countdown">00:00:00:00</div>
    <div class="timer-labels">
      <span>Дней</span>
      <span>Часов</span>
      <span>Минут</span>
      <span>Секунд</span>
    </div>
    <div class="release-info" id="releaseInfo">Релиз: 18 ноября в 14:00 (МСК)</div>
  </div>

  <h1 class="title">Приготовьтесь к релизу</h1>
  <p class="description">
    Выберите свой регион выше, чтобы следить за точным временем запуска игры.
  </p>

  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {}

    // Время переведено в чистый UTC (минус 3 часа от московского времени):
    // Месяц ноябрь = 10 (индексация 0-11)
    const REGIONS = {
      nz: {
        target: Date.UTC(2026, 10, 18, 11, 0, 0), // 14:00 МСК -> 11:00 UTC
        info: "Релиз: 18 ноября в 14:00 (МСК)"
      },
      in: {
        target: Date.UTC(2026, 10, 18, 18, 30, 0), // 21:30 МСК -> 18:30 UTC
        info: "Релиз: 18 ноября в 21:30 (МСК)"
      },
      tr: {
        target: Date.UTC(2026, 10, 18, 21, 0, 0), // 19 ноября 00:00 МСК -> 21:00 UTC
        info: "Релиз: 19 ноября в 00:00 (МСК)"
      },
      pl: {
        target: Date.UTC(2026, 10, 18, 23, 0, 0), // 19 ноября 02:00 МСК -> 23:00 UTC
        info: "Релиз: 19 ноября в 02:00 (МСК)"
      },
      us: {
        target: Date.UTC(2026, 10, 19, 5, 0, 0),  // 19 ноября 08:00 МСК -> 05:00 UTC
        info: "Релиз: 19 ноября в 08:00 (МСК)"
      }
    };

    let currentRegion = 'nz';

    function updateTimer() {
      const countdownEl = document.getElementById("countdown");
      if (!countdownEl) return;

      const now = Date.now();
      const difference = REGIONS[currentRegion].target - now;

      if (difference <= 0) {
        countdownEl.innerText = "00:00:00:00";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      const pad = (n) => String(n).padStart(2, "0");
      countdownEl.innerText = `${pad(days)}:${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    // Слушатели кликов по кнопкам через data-region
    document.querySelectorAll('.region-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const region = this.getAttribute('data-region');
        if (!region || !REGIONS[region]) return;

        currentRegion = region;

        document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');

        document.getElementById('releaseInfo').innerText = REGIONS[region].info;
        updateTimer();
      });
    });

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
