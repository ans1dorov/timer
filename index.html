<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GTA VI Countdown</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #120324;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .badge {
      background: #ffffff;
      color: #120324;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .region-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 440px;
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }
    .region-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #c0a7d9;
      border: 1px solid rgba(226, 73, 157, 0.3);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .region-btn.active {
      background: #e2499d;
      color: #ffffff;
      border-color: #e2499d;
      box-shadow: 0 0 14px rgba(226, 73, 157, 0.6);
    }
    .timer-card {
      border: 2px solid #e2499d;
      border-radius: 12px;
      padding: 24px 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 25px rgba(226, 73, 157, 0.35);
      background: rgba(255, 255, 255, 0.03);
    }

    /* Блок таймера со строгим позиционированием */
    .timer-grid {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
    }
    .timer-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 68px;
    }
    .timer-num {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 6px;
    }
    .timer-label {
      font-size: 10px;
      letter-spacing: 0.8px;
      color: #c0a7d9;
      text-transform: uppercase;
      font-weight: 600;
    }
    .timer-sep {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
      opacity: 0.85;
      padding-top: 2px;
    }

    .release-info {
      font-size: 13px;
      font-weight: 600;
      color: #ff8ad8;
      margin-top: 16px;
      letter-spacing: 0.3px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 28px 0 12px;
    }
    .description {
      font-size: 14px;
      line-height: 1.5;
      color: #d1c2e8;
      max-width: 360px;
    }
  </style>
</head>
<body>

  <div class="badge">Grand Theft Auto VI — Countdown</div>

  <div class="region-selector">
    <button type="button" class="region-btn active" onclick="changeRegion('nz', this)">🇳🇿 Новая Зеландия</button>
    <button type="button" class="region-btn" onclick="changeRegion('in', this)">🇮🇳 Индия</button>
    <button type="button" class="region-btn" onclick="changeRegion('tr', this)">🇹🇷 Турция</button>
    <button type="button" class="region-btn" onclick="changeRegion('pl', this)">🇵🇱 Польша</button>
    <button type="button" class="region-btn" onclick="changeRegion('us', this)">🇺🇸 США</button>
  </div>

  <div class="timer-card">
    <div class="timer-grid">
      <div class="timer-col">
        <div class="timer-num" id="days">00</div>
        <div class="timer-label">Дней</div>
      </div>
      <div class="timer-sep">:</div>
      <div class="timer-col">
        <div class="timer-num" id="hours">00</div>
        <div class="timer-label">Часов</div>
      </div>
      <div class="timer-sep">:</div>
      <div class="timer-col">
        <div class="timer-num" id="minutes">00</div>
        <div class="timer-label">Минут</div>
      </div>
      <div class="timer-sep">:</div>
      <div class="timer-col">
        <div class="timer-num" id="seconds">00</div>
        <div class="timer-label">Секунд</div>
      </div>
    </div>
    <div class="release-info" id="releaseInfo">Релиз: 18 ноября в 14:00 (МСК)</div>
  </div>

  <h1 class="title">Приготовьтесь к релизу</h1>
  <p class="description">
    Выберите свой регион выше, чтобы следить за точным временем запуска игры.
  </p>

  <script>
    var REGIONS = {
      nz: {
        target: 1795009200000, // 2026-11-18 11:00 UTC (14:00 МСК)
        info: "Релиз: 18 ноября в 14:00 (МСК)"
      },
      in: {
        target: 1795036200000, // 2026-11-18 18:30 UTC (21:30 МСК)
        info: "Релиз: 18 ноября в 21:30 (МСК)"
      },
      tr: {
        target: 1795045200000, // 2026-11-18 21:00 UTC (19 ноя 00:00 МСК)
        info: "Релиз: 19 ноября в 00:00 (МСК)"
      },
      pl: {
        target: 1795052400000, // 2026-11-18 23:00 UTC (19 ноя 02:00 МСК)
        info: "Релиз: 19 ноября в 02:00 (МСК)"
      },
      us: {
        target: 1795074000000, // 2026-11-19 05:00 UTC (19 ноя 08:00 МСК)
        info: "Релиз: 19 ноября в 08:00 (МСК)"
      }
    };

    var currentTarget = REGIONS.nz.target;

    function changeRegion(code, btnElement) {
      if (!REGIONS[code]) return;
      currentTarget = REGIONS[code].target;

      var buttons = document.querySelectorAll('.region-btn');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove('active');
      }
      btnElement.classList.add('active');

      document.getElementById('releaseInfo').innerText = REGIONS[code].info;
      updateDisplay();
    }

    function updateDisplay() {
      var diff = currentTarget - Date.now();

      var daysEl = document.getElementById("days");
      var hoursEl = document.getElementById("hours");
      var minutesEl = document.getElementById("minutes");
      var secondsEl = document.getElementById("seconds");

      if (diff <= 0) {
        daysEl.innerText = "00";
        hoursEl.innerText = "00";
        minutesEl.innerText = "00";
        secondsEl.innerText = "00";
        return;
      }

      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);

      var pad = function(n) { return (n < 10 ? '0' : '') + n; };
      daysEl.innerText = pad(d);
      hoursEl.innerText = pad(h);
      minutesEl.innerText = pad(m);
      secondsEl.innerText = pad(s);
    }

    updateDisplay();
    setInterval(updateDisplay, 1000);
  </script>
</body>
</html>
